# =============================================================================
# Naada — continuous integration.
#
# Runs on every push and every pull request. Two independent jobs so a broken
# frontend does not hide a broken backend (and the other way round).
#
# Nothing here needs a database server, a Redis server, or any secret. The
# backend tests run against a throwaway SQLite file, which is what makes this
# workflow fast and, more importantly, not flaky.
#
# ┌───────────────────────────────────────────────────────────────────────────┐
# │ KNOWN RED ON ARRIVAL — these are real bugs in the app, not CI problems.   │
# │                                                                          │
# │  1. `npm run build` / `npm run typecheck` fail with TS2322 in            │
# │     apps/frontend/src/App.tsx (lines 64 and 183-186). The `lazyScreen`   │
# │     helper cannot express a lazily-loaded screen that takes props, and   │
# │     LegalScreen takes `doc`. The frontend CANNOT BE DEPLOYED until this  │
# │     is fixed — `npm run build` is `tsc -b && vite build`, so the type    │
# │     error stops the bundle being produced at all.                        │
# │                                                                          │
# │  2. Four tests fail: three in                                            │
# │     apps/frontend/src/screens/admin/admin-disputes.test.tsx and one in   │
# │     apps/frontend/src/screens/artist/artist-gig-board.test.tsx. They     │
# │     look for text and buttons the components no longer render.           │
# │                                                                          │
# │ Both are outside the deployment work and are left as real, failing gates │
# │ on purpose: hiding them would let a non-deployable frontend look green.  │
# │ Backend: `check`, `check --deploy`, migrations and all 40 tests pass.    │
# └───────────────────────────────────────────────────────────────────────────┘
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch cancels the run still in flight, so the queue
# never fills up with builds of commits nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Backend — Django 5.1 / DRF / Channels / Celery
  # ───────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/backend

    env:
      # Local settings + the SQLite default from base.py. No services required.
      DJANGO_ENV: naada.settings.local
      PYTHONUNBUFFERED: "1"
      # Keep pip quiet and deterministic.
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.12 to match apps/backend/Dockerfile, so CI and the shipped image
          # resolve the same wheels.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: No model changes are missing a migration
        # Catches the classic "it works on my machine, the table is missing in
        # production" failure: a model edited without makemigrations.
        run: python manage.py makemigrations --check --dry-run

      - name: Test suite
        run: python manage.py test --noinput --verbosity 2

      # ── Production-settings gates ────────────────────────────────────────
      # naada.settings.production is a different settings module. It is the one
      # that actually runs in production, so it gets checked too. None of these
      # steps open a database socket, which is why the fake DATABASE_URL below
      # is harmless.
      - name: Production settings import and pass all checks
        env:
          DJANGO_ENV: naada.settings.production
          SECRET_KEY: ci-only-key-not-used-anywhere-real-9f2a7c4e1b8d6053
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          ALLOWED_HOSTS: ci.example.com,127.0.0.1
          CORS_ALLOWED_ORIGINS: https://ci.example.com
        run: python manage.py check --deploy

      - name: collectstatic succeeds
        # This is not busywork. Production serves static files through
        # WhiteNoise's CompressedManifestStaticFilesStorage, which returns a
        # 500 for any file missing from the generated manifest. If
        # collectstatic can fail, it must fail here and not on the live site.
        env:
          DJANGO_ENV: naada.settings.production
          SECRET_KEY: ci-only-key-not-used-anywhere-real-9f2a7c4e1b8d6053
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
          ALLOWED_HOSTS: ci.example.com,127.0.0.1
          CORS_ALLOWED_ORIGINS: https://ci.example.com
        run: python manage.py collectstatic --noinput --clear

      - name: Production refuses to boot misconfigured
        # Two deliberate safety rails in naada/settings/production.py. If either
        # ever stops raising, a deploy could silently come up on dev SQLite or
        # with a publicly-known signing key, so their absence is a test failure.
        env:
          DJANGO_ENV: naada.settings.production
          ALLOWED_HOSTS: ci.example.com
        run: |
          set +e

          echo "--- must refuse a SQLite DATABASE_URL ---"
          SECRET_KEY=ci-only-key-not-used-anywhere-real-9f2a7c4e1b8d6053 \
          DATABASE_URL=sqlite:///ci-should-never-boot.sqlite3 \
            python manage.py check >/dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "FAIL: production booted against SQLite"; exit 1
          fi
          echo "ok"

          echo "--- must refuse the insecure default SECRET_KEY ---"
          SECRET_KEY=django-insecure-local-dev-only-change-in-production \
          DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/ci \
            python manage.py check >/dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "FAIL: production booted with the insecure dev SECRET_KEY"; exit 1
          fi
          echo "ok"

  # ───────────────────────────────────────────────────────────────────────────
  # Frontend — React 18 + TypeScript + Vite (npm workspaces; install at root)
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22 to match apps/frontend/Dockerfile.
          node-version: "22"
          cache: npm
          # package-lock.json is at the repository root — this is an npm
          # workspaces monorepo and there is no lockfile in apps/frontend.
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # `npm ci` at the ROOT installs every workspace. Running it inside
        # apps/frontend fails: no lockfile there.
        run: npm ci

      - name: Type check
        # Currently FAILS — see the KNOWN RED block at the top of this file.
        run: npm run typecheck

      - name: Unit tests
        # Four tests currently fail — see the KNOWN RED block.
        run: npm test

      - name: Production build
        env:
          # Vite bakes this into the bundle. The value here only has to be
          # well-formed — CI never calls it. The real value is set on the
          # hosting dashboard and applied by rebuilding. See DEPLOY.md.
          VITE_API_BASE: https://api.example.com/api/v1
        run: npm run build

      - name: Upload build output
        # Lets you download and inspect the exact bundle a commit produced.
        # `if: success()` is implicit; there is nothing to upload otherwise.
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: apps/frontend/dist
          retention-days: 7
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Deployment config sanity — cheap, and catches a typo in a YAML/JSON file
  # before it turns into a failed deploy on the hosting dashboard.
  # ───────────────────────────────────────────────────────────────────────────
  config:
    name: Deployment config syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate YAML and JSON
        run: |
          python - <<'PY'
          import json, sys, pathlib, yaml

          yaml_files = ["docker-compose.yml",
                        "apps/backend/render.yaml",
                        ".github/workflows/ci.yml"]
          json_files = ["apps/backend/railway.json",
                        "apps/frontend/vercel.json",
                        "package.json",
                        "apps/frontend/package.json"]

          # render.yaml is expected at the repository root when the Render
          # Blueprint is actually in use; check it too if it has been copied.
          if pathlib.Path("render.yaml").exists():
              yaml_files.append("render.yaml")

          failed = False
          for f in yaml_files:
              try:
                  yaml.safe_load(pathlib.Path(f).read_text())
                  print(f"ok   {f}")
              except Exception as exc:
                  print(f"FAIL {f}: {exc}"); failed = True
          for f in json_files:
              try:
                  json.loads(pathlib.Path(f).read_text())
                  print(f"ok   {f}")
              except Exception as exc:
                  print(f"FAIL {f}: {exc}"); failed = True
          sys.exit(1 if failed else 0)
          PY
