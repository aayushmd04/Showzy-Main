# =============================================================================
# Showzy — security scanning.
#
# Four independent jobs, so one finding does not hide another:
#   python-deps   known CVEs in the backend's requirements (pip-audit)
#   python-sast   insecure patterns in our own Python (bandit)
#   npm-deps      known CVEs in the JavaScript dependencies (npm audit)
#   secrets       credentials committed anywhere in the repo's history (gitleaks)
#
# It also runs every Monday, with no code change: advisories are published against
# packages we already use, and that is exactly the case a push-only check misses.
# A failed scheduled run emails the repository owner.
#
# Every action is pinned to a full commit SHA, and the tools are pinned to exact
# versions: a moving tag is how a compromised release reaches CI. Dependabot
# (.github/dependabot.yml) proposes the bumps.
# =============================================================================

name: Security

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-deps:
    name: Python dependencies (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Audit requirements.txt
        # Two findings are acknowledged on purpose. Anything else fails the build.
        #   CVE-2026-106454  Twisted IMAP wildcard ReDoS. We use Twisted only as Daphne's
        #                    HTTP/WebSocket engine, never its IMAP code, and no fix exists yet.
        #   PYSEC-2026-3447  setuptools sdist MANIFEST.in handling. Build-time only, and the
        #                    fix (83.0.0) would remove pkg_resources, which razorpay 1.x imports.
        # Re-check both when bumping razorpay or Twisted, and delete a line once it is fixed.
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit -r apps/backend/requirements.txt \
            --ignore-vuln CVE-2026-106454 \
            --ignore-vuln PYSEC-2026-3447

  python-sast:
    name: Python static analysis (bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run bandit
        # -ll: medium severity and up. -ii: medium confidence and up (the low-confidence
        # "request without timeout" hits are false positives; those calls do set one).
        # Tests, migrations and the dev-only seed commands are not production code.
        working-directory: apps/backend
        run: |
          python -m pip install --disable-pip-version-check bandit==1.9.4
          bandit -r apps naada -ll -ii \
            -x '*/tests.py,*/test_*.py,*/migrations/*,*/management/*'

  npm-deps:
    name: JavaScript dependencies (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Audit
        # Anything that ships to browsers fails on ANY severity. Dev tooling fails on high
        # and critical, because those run on developers' laptops and in CI.
        run: |
          npm audit --omit=dev
          npm audit --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history: a secret that was committed and later deleted is still leaked.
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        # The release binary, verified against a checksum written here, rather than a
        # third-party action. Config and its allowlist: .gitleaks.toml.
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose --log-opts="--all"
