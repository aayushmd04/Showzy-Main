<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Light by default: set the theme before the first paint so there is no dark flash.
      try {
        var t = sessionStorage.getItem("naada_theme") || localStorage.getItem("naada_theme");
        if (t !== "dark") document.documentElement.classList.add("theme-light");
      } catch (e) {
        document.documentElement.classList.add("theme-light");
      }
      // The page blooms in once the opening loading screen is done. Hold it hidden until then
      // (only where that screen will actually show), with a failsafe so it can never stay hidden.
      try {
        var p = location.pathname;
        if ((p === "/" || p === "/whats-on") && !sessionStorage.getItem("showzy_splash_seen")) {
          document.documentElement.classList.add("bloom-wait");
          setTimeout(function () { document.documentElement.classList.remove("bloom-wait"); }, 12000);
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAFA" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Showzy" />
    <meta property="og:site_name" content="Showzy" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Showzy — live music in Mysuru &amp; Bengaluru" />
    <meta property="og:description" content="Grassroots live music. Open mics, jam nights, pub gigs and classical evenings." />
    <!-- A poster is what makes a link worth tapping when it lands in a
         WhatsApp group, which is how most gigs here actually travel. Event and
         artist pages replace this with their own image at runtime; this is the
         fallback for everything else, and for scrapers that arrive first. -->
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Showzy — live music in Mysuru and Bengaluru" />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="description" content="Showzy — grassroots live music in Mysuru and Bengaluru. Open mics, jam nights, pub gigs and classical evenings." />
    <title>Showzy — live music in Mysuru &amp; Bengaluru</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
