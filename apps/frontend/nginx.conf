# Showzy frontend — nginx server block.
# Copied to /etc/nginx/conf.d/default.conf by apps/frontend/Dockerfile,
# replacing the image's stock config.

server {
    # 8080, not 80, so nothing here needs root privileges.
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in Server: headers.
    server_tokens off;

    # ── Compression ──────────────────────────────────────────────────────────
    # The JS bundle is ~577 kB raw, ~175 kB gzipped. Worth it.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/xml image/svg+xml font/woff2;

    # ── Health probe ─────────────────────────────────────────────────────────
    # Used by the docker-compose healthcheck. Returns instantly, logs nothing.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── Hashed build assets ──────────────────────────────────────────────────
    # Vite fingerprints these (index-C7uIjipZ.css), so the filename changes
    # whenever the content does. Safe to cache permanently.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /usr/share/nginx/html/security-headers.conf;
        try_files $uri =404;
    }

    # ── index.html ───────────────────────────────────────────────────────────
    # Must NEVER be cached: it is the file that points at the current hashed
    # bundle. A cached index.html is why users keep seeing the old app after
    # a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /usr/share/nginx/html/security-headers.conf;
        expires -1;
    }

    # ── SPA history fallback ─────────────────────────────────────────────────
    # THIS IS THE IMPORTANT ONE.
    #
    # React Router owns URLs like /host/events/7f3a-... but there is no such
    # file on disk. Without this line, opening that URL directly — a refresh,
    # a bookmark, a link pasted into WhatsApp — returns nginx's 404 page and
    # the app never boots. try_files serves the real file if one exists,
    # otherwise hands index.html to the browser and lets React Router read
    # the URL from there.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Security headers ─────────────────────────────────────────────────────
    # The CSP and the rest are generated at build time by
    # apps/frontend/build/security-headers.ts, because the CSP has to name this
    # build's API address. nginx does NOT inherit add_header into a location that
    # sets its own, so locations with their own add_header repeat this include.
    include /usr/share/nginx/html/security-headers.conf;

    # Build plumbing, not content.
    location = /security-headers.conf { internal; }
    location = /_headers              { internal; }
}
